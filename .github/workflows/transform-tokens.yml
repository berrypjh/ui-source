name: Transform Tokens

on:
  push:
    branches: [design-tokens]
    paths:
      - 'shared/design-tokens/src/data.json'

jobs:
  build-and-pr:
    name: Transform & Create PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./shared/design-tokens
        run: npm install --workspaces=false --no-package-lock

      - name: Transform & Build Tokens
        working-directory: ./shared/design-tokens
        run: npm run build:tokens

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'design(root): update design tokens from figma'
          title: '🤖 Design Tokens Update'
          body: |
            Figma Tokens Studio에서 새로운 디자인 토큰이 업데이트되었습니다.
            자동 변환된 스타일 파일을 확인해주세요.
          branch: 'design-tokens-build'
          delete-branch: true
          base: design-tokens
